<style>@font-face { font-family: "Marcellus"; font-style: normal; font-weight: 400; font-display: swap; src: url("/wp-content/themes/islamicdilemma/assets/fonts/marcellus-normal-400-latin.woff2") format("woff2"); }
@font-face { font-family: "Sabon Next LT"; font-style: normal; font-weight: 400; font-display: swap; src: url("/wp-content/themes/islamicdilemma/assets/fonts/sabon-next-lt-regular.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 100 700; font-display: swap; src: url("/wp-content/themes/islamicdilemma/assets/fonts/ibm-plex-sans-normal-variable-latin.woff2") format("woff2"); }
:root { color-scheme: light; --navy: #18283c; --gold: #b18b54; --gold-text: #7d5c2a; --paper: #f7f4ed; --surface: #fffdf8; --ink: #202936; --muted: #5e6670; --line: #dcd8ce; --on-navy: #f3efe6; }
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.65 "Sabon Next LT", Literata, "Iowan Old Style", Georgia, serif; }
.band { background: var(--navy); border-bottom: 3px solid var(--gold); padding: 18px 16px; text-align: center; }
.site { color: var(--on-navy); font: 400 1.25rem/1.3 Marcellus, "Trajan Pro", Georgia, serif; letter-spacing: 0.04em; text-decoration: none; }
.site:hover { text-decoration: underline; text-underline-offset: 4px; }
.card { max-width: 560px; margin: 56px auto; padding: 32px 28px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 20px; box-shadow: 0 10px 24px rgba(24, 40, 60, 0.12); }
.label { margin: 0 0 8px; color: var(--gold-text); font: 600 0.75rem/1.3 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
h1 { margin: 0 0 16px; color: var(--navy); font: 400 2rem/1.18 Marcellus, "Trajan Pro", Georgia, serif; }
p { margin: 0 0 12px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 24px 0 0; }
.button { display: inline-block; padding: 10px 22px; background: var(--navy); color: var(--on-navy); border-radius: 999px; font: 600 0.95rem/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-decoration: none; }
.button:hover { background: #223650; }
.link { color: var(--navy); font: 500 0.95rem/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
@media (max-width: 600px) {
	.card { margin: 24px 16px; padding: 24px 20px; }
	h1 { font-size: 1.6rem; }
}</style>
